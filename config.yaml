dashboard: true

sources:
  - name: exchange_rates
    enabled: true
    worksheet: "Exchange Rates"
    mode: append
    params:
      base_currency: USD
      target_currencies: [EUR, UAH, GBP, PLN, CHF, JPY, CAD, AUD, CNY, SEK,
                          NOK, DKK, CZK, HUF, RON, TRY, INR, BRL, MXN, KRW,
                          SGD, HKD, NZD, ZAR, ILS, AED, SAR, EGP, GEL, MDL]

